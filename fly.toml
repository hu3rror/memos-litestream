# fly.toml app configuration file generated for memos-litestream1 on 2026-08-15T12:58:04+08:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#
# Approach A (recommended): single container, entrypoint.sh manages all processes
#   fly launch --no-deploy
#   fly secrets set LITESTREAM_REPLICA_BUCKET=...
#   fly secrets set LITESTREAM_REPLICA_ENDPOINT=...
#   fly secrets set AWS_ACCESS_KEY_ID=...
#   fly secrets set AWS_SECRET_ACCESS_KEY=...
#   fly secrets set LITESTREAM_REPLICA_PATH=memos_prod.db
#   fly deploy
#   # Stuck on "Waiting for depot builder..."? Try fly deploy --depot=false
#
# Approach B: multi-container sidecar, see cli-config.json and README.md

app = 'memos-litestream'
primary_region = 'sjc'

[build]
  [build.args]
    USE_MEMOGRAM = "1"

[env]
  DB_PATH = '/var/opt/memos/memos_prod.db'
  MEMOS_MODE = 'prod'
  MEMOS_PORT = '5230'

[[mounts]]
  source = 'memos'
  destination = '/var/opt/memos'

[http_service]
  internal_port = 5230
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
