name: build-and-push

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
        description: "Image tag (e.g. 'stable' or 'stable-memogram')"
      use_memogram:
        required: false
        type: boolean
        default: false
        description: "Set USE_MEMOGRAM=1 build arg"
      add_version_tag:
        required: false
        type: boolean
        default: false
        description: "Add semver version tag from upstream memos release"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Extract latest memos release
        if: inputs.add_version_tag
        id: version
        run: |
          RELEASE=$(curl -sL https://api.github.com/repos/usememos/memos/releases/latest | jq -r '.tag_name')
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"

      - name: Derive semver tag suffix from raw tag
        if: inputs.add_version_tag
        id: vtag
        run: |
          SUFFIX=""
          case "${{ inputs.tag }}" in
            *-memogram) SUFFIX="-memogram" ;;
          esac
          echo "value=${{ steps.version.outputs.release }}$SUFFIX" >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/hu3rror/memos-litestream
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ inputs.tag }}
            ${{ inputs.add_version_tag && format('type=raw,value={0}', steps.vtag.outputs.value) || '' }}

      - name: Build and Push
        uses: docker/build-push-action@v7
        with:
          context: ./
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            ${{ inputs.use_memogram && 'USE_MEMOGRAM=1' || '' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}