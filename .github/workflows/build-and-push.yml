name: build-and-push

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
        description: "Image tag (e.g. 'stable', 'stable-memogram', 'test')"
      use_memogram:
        required: false
        type: boolean
        default: false
        description: "Set USE_MEMOGRAM=1 build arg"
      memos_image_tag:
        required: false
        type: string
        default: ""
        description: "Override MEMOS_IMAGE_TAG build arg (e.g. 'latest')"
      platforms:
        required: false
        type: string
        default: "linux/amd64,linux/arm64"
        description: "Comma-separated target platforms"
      add_version_tag:
        required: false
        type: boolean
        default: false
        description: "Add semver version tag from upstream memos release"
      pinned_buildx_version:
        required: false
        type: string
        default: ""
        description: "Pin buildx version (e.g. 'v0.9.1')"
    secrets:
      # ghcr.io token is passed automatically via github.token
      # but workflow_call needs explicit secret passing for cross-repo
      # For same-repo calls, github.token is inherited

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Extract latest memos release (for version tag)
        if: inputs.add_version_tag
        id: version
        uses: pozetroninc/github-action-get-latest-release@v0.8.0
        with:
          owner: usememos
          repo: memos
          excludes: prerelease, draft
          token: ${{ github.token }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          install: true
          version: ${{ inputs.pinned_buildx_version || '' }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/hu3rror/memos-litestream
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ inputs.tag }}
            ${{ inputs.add_version_tag && format('type=semver,pattern={{version}},value={0}', steps.version.outputs.release) || '' }}
            ${{ inputs.add_version_tag && format('type=semver,pattern={{version}},value={0}-memogram', steps.version.outputs.release) || '' }}

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: ./
          file: ./Dockerfile
          platforms: ${{ inputs.platforms }}
          build-args: |
            ${{ inputs.use_memogram && 'USE_MEMOGRAM=1' || '' }}
            ${{ inputs.memos_image_tag && format('MEMOS_IMAGE_TAG={0}', inputs.memos_image_tag) || '' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}